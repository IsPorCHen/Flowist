services:
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api-gateway
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ../src/Hosts/Flowist.Host.ApiGateway/appsettings.creds.json:/app/appsettings.creds.json:ro
    restart: unless-stopped
    networks:
      - flowist-network

  telegram-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.telegram-bot
    container_name: telegram-bot
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ../src/Hosts/Flowist.Host.TelegramBot/appsettings.creds.json:/app/appsettings.creds.json:ro
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - flowist-network

networks:
  flowist-network:
    driver: bridge